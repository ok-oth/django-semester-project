{% extends "base.html" %}

{% block title %}Delete Assignment — Assignment & Task Tracker{% endblock %}

{% block content %}
<div class="card" style="max-width: 520px; margin: 0 auto;">
    <h2>Delete Assignment</h2>
    <p>Are you sure you want to delete <strong>[{{ assignment.course_code }}] {{ assignment.title }}</strong>?</p>
    <form method="post">
        {% csrf_token %}
        <div class="actions">
            <button type="submit" class="btn-danger">Yes, Delete</button>
            <a href="{% url 'assignment_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
