{% extends "base.html" %}

{% block title %}Sign Up — Assignment & Task Tracker{% endblock %}

{% block content %}
<div class="card" style="max-width: 520px; margin: 0 auto;">
    <h2>Create Student Account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Register</button>
    </form>
    <p class="meta">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
