{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Student Assignment Tracker{% endblock %}</title>
    <style>
        :root {
            --bg: #f4f6f9;
            --surface: #ffffff;
            --text: #1e293b;
            --muted: #64748b;
            --primary: #0f294a;
            --primary-hover: #1b3f6e;
            --accent: #b45309;
            --border: #e2e8f0;
            --pending-bg: #fef3c7;
            --pending-text: #92400e;
            --progress-bg: #dbeafe;
            --progress-text: #1e40af;
            --done-bg: #dcfce7;
            --done-text: #166534;
            --danger: #dc2626;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }

        .navbar {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            text-decoration: none;
            color: var(--primary);
            font-weight: 700;
            font-size: 1.05rem;
        }

        .brand img {
            height: 40px;
            width: auto;
            object-fit: contain;
        }

        .nav-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
            color: var(--muted);
        }

        .container {
            max-width: 1050px;
            margin: 1.75rem auto;
            padding: 0 1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 1.5rem;
            align-items: start;
        }

        @media (max-width: 820px) {
            .grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem 1.5rem;
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
        }

        h1, h2 {
            margin-top: 0;
            color: var(--primary);
            font-size: 1.2rem;
        }

        form p {
            margin: 0 0 0.85rem;
        }

        label {
            display: block;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 0.3rem;
            color: var(--text);
        }

        input[type="text"],
        input[type="password"],
        input[type="date"],
        select,
        textarea {
            width: 100%;
            padding: 0.55rem 0.7rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
            background: #fff;
        }

        input:focus, select:focus, textarea:focus {
            outline: 2px solid rgba(15, 41, 74, 0.2);
            border-color: var(--primary);
        }

        button, .btn {
            display: inline-block;
            padding: 0.5rem 0.9rem;
            border-radius: 6px;
            border: 1px solid transparent;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            background: var(--primary);
            color: #fff;
        }

        button:hover, .btn:hover {
            background: var(--primary-hover);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--text);
            border-color: #cbd5e1;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .btn-danger {
            background: var(--danger);
            color: #fff;
        }

        .btn-sm {
            padding: 0.32rem 0.65rem;
            font-size: 0.8rem;
        }

        .filter-bar {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            margin-bottom: 1.1rem;
        }

        .filter-bar input, .filter-bar select {
            width: auto;
            min-width: 150px;
            flex: 1;
        }

        .assignment-list {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .assignment-item {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.9rem 1rem;
            background: #fafbfd;
        }

        .assignment-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .course-tag {
            background: #e2e8f0;
            color: var(--primary);
            padding: 0.15rem 0.45rem;
            border-radius: 4px;
            font-size: 0.78rem;
            font-weight: 700;
            margin-right: 0.35rem;
        }

        .badge {
            padding: 0.2rem 0.55rem;
            border-radius: 999px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .badge-PENDING { background: var(--pending-bg); color: var(--pending-text); }
        .badge-IN_PROGRESS { background: var(--progress-bg); color: var(--progress-text); }
        .badge-COMPLETED { background: var(--done-bg); color: var(--done-text); }

        .meta {
            font-size: 0.85rem;
            color: var(--muted);
            margin-top: 0.3rem;
        }

        .actions {
            margin-top: 0.65rem;
            display: flex;
            gap: 0.45rem;
            flex-wrap: wrap;
            align-items: center;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <a class="brand" href="{% url 'assignment_list' %}">
            <img src="{% static 'images/strathmore-logo.png' %}" alt="Strathmore University Logo">
            <span>Assignment &amp; Task Tracker</span>
        </a>
        <div class="nav-right">
            {% if request.user.is_authenticated %}
                <span>Hi, <strong>{{ request.user.username }}</strong></span>
                <form action="{% url 'logout' %}" method="post" style="display:inline; margin:0;">
                    {% csrf_token %}
                    <button type="submit" class="btn-secondary btn-sm">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-sm">Login</a>
                <a href="{% url 'signup' %}" class="btn btn-secondary btn-sm">Sign Up</a>
            {% endif %}
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
